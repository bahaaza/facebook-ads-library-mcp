[project]
name = "facebook-adwatch"
version = "0.1.0"
description = "Self-hosted competitor Ad Library monitor and MCP server"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "playwright>=1.50,<2", "markdownify>=1.1,<2",
  "fastmcp>=2.6,<4", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["adwatch"]
[tool.hatch.build.targets.wheel.force-include]
"facebook_ads_mcp_complete.py" = "facebook_ads_mcp_complete.py"
